<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BFTools · Tools for the work you repeat</title>
  <desc id="desc">Window layouts, content production and a workspace that feels like yours, in the navy and indigo visual family of LydiaHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="glow" x1="70" y1="50" x2="1040" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
